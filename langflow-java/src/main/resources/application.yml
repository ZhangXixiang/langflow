server:
  port: 8080

spring:
  application:
    name: langflow-java
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  ai:
    openai:
      enabled: false
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics